<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#12295C" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#071126" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Glowing Lines Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background with Blueprint Grid -->
  <rect width="800" height="600" rx="20" fill="url(#bgGlow)" stroke="#1E3D8F" stroke-width="2"/>
  
  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.12" stroke="#00E5FF" stroke-width="1">
    <line x1="100" y1="50" x2="100" y2="550"/>
    <line x1="200" y1="50" x2="200" y2="550"/>
    <line x1="300" y1="50" x2="300" y2="550"/>
    <line x1="400" y1="50" x2="400" y2="550"/>
    <line x1="500" y1="50" x2="500" y2="550"/>
    <line x1="600" y1="50" x2="600" y2="550"/>
    <line x1="700" y1="50" x2="700" y2="550"/>
    
    <line x1="50" y1="100" x2="750" y2="100"/>
    <line x1="50" y1="200" x2="750" y2="200"/>
    <line x1="50" y1="300" x2="750" y2="300"/>
    <line x1="50" y1="400" x2="750" y2="400"/>
    <line x1="50" y1="500" x2="750" y2="500"/>
  </g>

  <!-- Triangle Structure (Total 25 Triangles nested geometry) -->
  <!-- Main Vertices: Top (400, 70), Bottom-Left (120, 510), Bottom-Right (680, 510) -->
  <!-- Horizontal Partition Lines: 
       Level 1 (y = 180): (330, 180) to (470, 180)
       Level 2 (y = 290): (260, 290) to (540, 290)
       Level 3 (y = 400): (190, 400) to (610, 400)
       Base (y = 510): (120, 510) to (680, 510)
       Internal Ray 1: from (400, 70) to (307, 510)
       Internal Ray 2: from (400, 70) to (493, 510)
       Inverted inner triangles crossbars
  -->
  <g id="triangle-mesh" filter="url(#goldGlow)">
    <!-- Outer Main Triangle -->
    <polygon points="400,70 120,510 680,510" fill="none" stroke="#FFC425" stroke-width="5" stroke-linejoin="round"/>
    
    <!-- Level 1 Horizontal -->
    <line x1="330" y1="180" x2="470" y2="180" stroke="#FFC425" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Level 2 Horizontal -->
    <line x1="260" y1="290" x2="540" y2="290" stroke="#FFC425" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Level 3 Horizontal -->
    <line x1="190" y1="400" x2="610" y2="400" stroke="#FFC425" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Internal Radial Rays from Apex -->
    <line x1="400" y1="70" x2="280" y2="510" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round" filter="url(#cyanGlow)"/>
    <line x1="400" y1="70" x2="520" y2="510" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round" filter="url(#cyanGlow)"/>
    <line x1="400" y1="70" x2="400" y2="510" stroke="#FFDD66" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Inner Diagonal Connectors creating sub-triangles -->
    <line x1="330" y1="180" x2="400" y2="290" stroke="#FFC425" stroke-width="3"/>
    <line x1="470" y1="180" x2="400" y2="290" stroke="#FFC425" stroke-width="3"/>
    
    <line x1="260" y1="290" x2="330" y2="400" stroke="#FFC425" stroke-width="3"/>
    <line x1="400" y1="290" x2="470" y2="400" stroke="#FFC425" stroke-width="3"/>
    <line x1="540" y1="290" x2="470" y2="400" stroke="#FFC425" stroke-width="3"/>
    
    <line x1="190" y1="400" x2="280" y2="510" stroke="#FFC425" stroke-width="3"/>
    <line x1="330" y1="400" x2="400" y2="510" stroke="#FFC425" stroke-width="3"/>
    <line x1="470" y1="400" x2="400" y2="510" stroke="#FFC425" stroke-width="3"/>
    <line x1="610" y1="400" x2="520" y2="510" stroke="#FFC425" stroke-width="3"/>
  </g>

  <!-- Glowing Vertex Nodes -->
  <g fill="#FFFFFF" stroke="#FFC425" stroke-width="2.5" filter="url(#goldGlow)">
    <circle cx="400" cy="70" r="7"/>
    <circle cx="120" cy="510" r="7"/>
    <circle cx="680" cy="510" r="7"/>
    <circle cx="330" cy="180" r="5"/>
    <circle cx="470" cy="180" r="5"/>
    <circle cx="260" cy="290" r="5"/>
    <circle cx="400" cy="290" r="5"/>
    <circle cx="540" cy="290" r="5"/>
    <circle cx="190" cy="400" r="5"/>
    <circle cx="330" cy="400" r="5"/>
    <circle cx="470" cy="400" r="5"/>
    <circle cx="610" cy="400" r="5"/>
    <circle cx="280" cy="510" r="5"/>
    <circle cx="400" cy="510" r="5"/>
    <circle cx="520" cy="510" r="5"/>
  </g>
</svg>
